spring:
  application:
    name: life-assistant-agent
  ai:
    dashscope:
      api-key: ${ai.my-api-key}
      chat:
        options:
          model: qwen-plus-2025-09-11
#    因为手动引入pgvector，而不是自动装配AutoConfig，所以下面这些配置直接在pgvector里面手动配置，不用写在application了，手动更灵活，可以自定义
#    vectorstore:
#      pgvector:
#      index-type: HNSW
#      distance-type: COSINE_DISTANCE
#      dimensions: 1024
#      max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
  datasource:
    url: jdbc:postgresql://${docker.localhost}:5432/life_assistant_agent
    username: postgres
    password: ${pgsql.password}
  data:
    redis:
      host: ${docker.localhost}
      port: 6379
  profiles:
    active: local

server:
  port: 8124
  servlet:
    context-path: /api


springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: com.yupi.lifeassistant.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

life-assistant:
  workspace: ${LIFE_ASSISTANT_WORKSPACE:D:/codex/life-assistant-agent/tmp}
  memory:
    sleeptime:
      trigger-user-messages: 20 # supervisor 每新增 20 条外部用户消息后触发一次后台记忆整理
      recent-message-limit: 40 # 每次整理只读取最近一段 supervisor 对话，避免把完整历史塞给压缩 Agent
      lock-minutes: 10 # Redis 分布式锁过期时间，防止同一 supervisor 会话重复整理
  vectorstore:
    auto-init: true # 启用自动同步（推荐常驻）
    force-reinit: false # 默认false，需要全量重刷时临时改为true
