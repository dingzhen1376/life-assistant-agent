<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeManus 生活助手</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">L</div>
        <div>
          <div class="brand-name">LifeManus</div>
          <div class="brand-subtitle">超级生活助手</div>
        </div>
      </div>

      <button class="new-chat-btn" id="newChatBtn" type="button">
        <span>+</span>
        <span>新对话</span>
      </button>

      <nav class="thread-list" id="threadList" aria-label="对话列表"></nav>

      <div class="sidebar-footer">
        <button class="ghost-btn" id="settingsBtn" type="button" title="接口设置">接口设置</button>
        <button class="ghost-btn danger" id="clearBtn" type="button" title="清空本地记录">清空记录</button>
      </div>
    </aside>

    <main class="chat-main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn" type="button" title="打开侧边栏">☰</button>
        <div class="topbar-title">
          <strong>LifeManus</strong>
          <span id="connectionState">未连接</span>
        </div>
        <button class="icon-btn" id="themeBtn" type="button" title="切换主题">◐</button>
      </header>

      <section class="message-region" id="messageRegion" aria-live="polite">
        <div class="empty-state" id="emptyState">
          <div class="empty-logo">L</div>
          <h1>今天想安排什么？</h1>
          <div class="prompt-grid">
            <button class="prompt-chip" type="button">帮我规划一个高效周末</button>
            <button class="prompt-chip" type="button">整理今天待办并归档</button>
            <button class="prompt-chip" type="button">根据冰箱食材推荐晚餐</button>
            <button class="prompt-chip" type="button">出差两天帮我列行李清单</button>
          </div>
        </div>
      </section>

      <section class="composer-wrap">
        <form class="composer" id="chatForm">
          <textarea id="messageInput" rows="1" placeholder="给 LifeManus 发送消息"></textarea>
          <div class="composer-actions">
            <button class="stop-btn" id="stopBtn" type="button" title="停止生成" disabled>■</button>
            <button class="send-btn" id="sendBtn" type="submit" title="发送">↑</button>
          </div>
        </form>
        <p class="hint">LifeManus 可能会调用工具生成计划。医疗急救等高风险问题请优先联系专业人员。</p>
      </section>
    </main>
  </div>

  <dialog class="settings-dialog" id="settingsDialog">
    <form method="dialog">
      <div class="dialog-head">
        <h2>接口设置</h2>
        <button class="icon-btn" value="cancel" type="submit" title="关闭">×</button>
      </div>
      <label class="field">
        <span>API Base URL</span>
        <input id="apiBaseInput" type="text" autocomplete="off" spellcheck="false">
      </label>
      <p class="field-help">默认：<code>/api</code>，由 Nginx 代理到后端服务。</p>
      <div class="dialog-actions">
        <button class="ghost-btn" value="cancel" type="submit">取消</button>
        <button class="primary-btn" id="saveSettingsBtn" value="default" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
